version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mindbridge:mindbridge_secret@db:5432/mindbridgedb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./mindbridge.db:/app/mindbridge.db # Kept for sqlite fallback if needed
    depends_on:
      - db
  
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=mindbridge
      - POSTGRES_PASSWORD=mindbridge_secret
      - POSTGRES_DB=mindbridgedb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
