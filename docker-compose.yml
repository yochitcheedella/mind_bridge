version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mindbridge.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./mindbridge.db:/app/mindbridge.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
